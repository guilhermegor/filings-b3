site_name: Filings B3
site_description: Documentação do Filings B3
repo_url: https://github.com/guilhermegor/filings-b3
nav:
  - Início: index.md
  - Uso: usage.md
  - Exemplos: examples.md
  - Referência da API:
      - Visão geral: api/index.md
      - Referência: api/reference.md
  - FAQ: faq.md
  - Contribuindo: contributing.md
  - Changelog: changelog.md
extra_css:
  - stylesheets/extra.css

theme:
  name: material
  # Idioma da interface do Material (busca, "Próximo"/"Anterior", etc.) em português.
  language: pt-BR
  # Brand mark served from docs/assets/ (MkDocs only serves files under docs/).
  logo: assets/b3-logo.jpg
  favicon: assets/b3-logo.jpg
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Mudar para o modo escuro
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/white-balance-sunny
        name: Mudar para o modo claro
# mike drives Material's version dropdown. The release workflow deploys each X.Y with the
# `latest` alias to the gh-pages branch; this line makes the theme render the selector.
extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  # Enables the `--8<-- "CHANGELOG.md"` include on the Changelog page (single-sources the root file).
  - pymdownx.snippets:
      base_path:
        - .

# Non-published docs: MkDocs builds every .md under docs/, so working
# documents must be excluded here or they ship to readers.
# NOTE: exclude_docs uses .gitignore syntax, which has NO inline comments — a trailing
# "# ..." becomes part of the pattern and silently disables the exclusion. Keep every
# comment on its own line above the pattern.
exclude_docs: |
  # work-to-do backlogs / follow-up notes
  backlog/
  # design specs / working notes, not published
  superpowers/
  # docs/ authoring guidance, not a published page
  CLAUDE.md
  # scaffolding-lessons mirrors (also git-ignored) — never publish backport notes
  blueprintx-lessons.md
  dotfiles-dev-lessons.md
  # offline merge-checkpoint log, internal
  checkpoints.md
  # git-ignored scaffolding-lessons record, never published
  blueprintx-lessons.md
